[tool.setuptools]
packages = ["valinor", "valinor_simulation"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "valinor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "h5py>=3.9",
  "numpy>=2.3,<3",
  "pandas>=2.2,<3",
  "scipy>=1.12,<2",
  "numpyro>=0.19,<0.20",
  "optax>=0.2.5,<0.3",
  "seaborn>=0.12.2,<0.13",
  "matplotlib>=3.7.2,<4",
  "tqdm>=4.65.1,<5",
  "pyarrow>=20,<21",
  "tables>=3.6,<4",
  "pyyaml>=6.0.1,<7",
  "jax>=0.7,<0.8",
]

[project.optional-dependencies]
cuda12 = [
  "jax[cuda12]>=0.7,<0.8",
]

[project.scripts]
valinor = "valinor.run_valinor:run"
valinor_pyro = "valinor.run_valinor_pyro:run"
valinorreport = "valinor.build_report:run"
valinor_sim = "valinor_simulation.dko_sim:run"
