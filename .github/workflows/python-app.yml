# .github/workflows/valinor.yml
name: Valinor

on:
    push:
        branches: ["main", "update_docs"]
    pull_request:
        branches: ["main"]
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python 3.11
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install nose2
                  pip install -e .

            - name: Test with nose2
              run: nose2

    docs:
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/update_docs' }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python 3.11
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install Sphinx dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install sphinx sphinx_rtd_theme

            - name: Build docs (make html in sources/)
              run: |
                  make -C sources html

            - name: Resolve Sphinx output dir
              id: outdir
              run: |
                  for p in sources/build/html sources/_build/html sources/build sources/_build; do
                    if [ -d "$p" ]; then
                      echo "dir=$p" >> "$GITHUB_OUTPUT"
                      exit 0
                    fi
                  done
                  echo "Sphinx build output not found" >&2
                  ls -R
                  exit 1

            - name: Copy site into /docs and disable Jekyll
              run: |
                  rm -rf docs
                  mkdir -p docs
                  cp -R "${{ steps.outdir.outputs.dir }}/." docs/
                  touch docs/.nojekyll

            - name: Commit and push docs to update_docs (Pages branch/folder)
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add -A docs
                  if git diff --cached --quiet; then
                    echo "No changes to commit."
                  else
                    git commit -m "Update docs [skip ci]"
                    git push origin HEAD:update_docs
                  fi
