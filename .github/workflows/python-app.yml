# .github/workflows/valinor.yml
name: Valinor

on:
    push:
        branches: ["main", "update_docs"]
    pull_request:
        branches: ["main"]
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python 3.11
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install nose2
                  pip install -e .

            - name: Test with nose2
              run: nose2

    docs:
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/update_docs' }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install Sphinx dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install sphinx sphinx_rtd_theme

            - name: Sphinx build
              run: sphinx-build sources build

            - name: Deploy to GitHub Pages (update_docs -> /docs)
              uses: peaceiris/actions-gh-pages@v3
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_branch: update_docs
                  publish_dir: build/
                  destination_dir: docs
                  force_orphan: false
